# Runs the test suite on GitHub's computers after every push. The tests use
# small synthetic images, so no data download is needed; the Cellpose tests
# are skipped because Cellpose is not installed here.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and pytest
        run: pip install -e ".[dev]"
      - name: Run the tests
        run: pytest -q
